# Amounts are USDC base units (6 decimals). Addresses are lowercase hex strings.

type User {
  id: ID! # lowercase address
  famId: String!
  role: String!
  familyId: Int!
  level: Int!
  frozen: Boolean!
  createdAt: Int!
}

type Family {
  id: ID! # familyId
  parent: String!
  parentFamId: String!
  createdAt: Int!
  tzOffset: Int! # seconds from UTC; weeks and days are cut in this local time
}

type Stream {
  id: ID! # teen address
  remaining: BigInt!
  rate: BigInt!
  updatedAt: Int!
}

type Payment {
  id: ID!
  fromAddr: String!
  toAddr: String!
  fromFamId: String!
  toFamId: String!
  amount: BigInt!
  memo: String!
  ts: Int!
  txHash: String!
}

type Pending {
  id: ID! # pending id
  fromAddr: String!
  toAddr: String!
  fromFamId: String!
  toFamId: String!
  familyId: Int!
  amount: BigInt!
  kind: String! # OVER_LIMIT | ANOMALY
  status: String! # OPEN | EXECUTED | REJECTED | CANCELLED
  releaseAt: Int!
  refKind: String! # NONE | SPLIT | REQUEST
  refId: String!
  memo: String!
  createdAt: Int!
  txHash: String!
}

type Goal {
  id: ID!
  teen: String!
  teenFamId: String!
  familyId: Int!
  target: BigInt!
  saved: BigInt!
  matched: BigInt!
  status: String! # PROPOSED | ACTIVE | COMPLETE | CLOSED
  deadline: Int!
  memo: String!
  sponsorOpen: Boolean!
  createdAt: Int!
}

type Gift {
  id: ID!
  familyId: Int!
  teen: String!
  goalId: String!
  sponsor: String!
  sponsorFamId: String!
  amount: BigInt!
  escrow: BigInt!
  released: BigInt!
  ratio: BigInt!
  deadline: Int!
  createdAt: Int!
}

type Split {
  id: ID!
  creator: String!
  creatorFamId: String!
  perShare: BigInt!
  slots: Int!
  paid: Int!
  memo: String!
  createdAt: Int!
}

type SplitShare {
  id: ID! # splitId-payer
  splitId: String!
  payer: String!
  payerFamId: String!
  active: Boolean!
  ts: Int!
}

type Request {
  id: ID!
  fromAddr: String!
  toAddr: String!
  fromFamId: String!
  toFamId: String!
  amount: BigInt!
  status: String! # OPEN | PAID
  memo: String!
  createdAt: Int!
}

# One row per thing worth showing on a timeline, already written in plain language.
type TimelineEntry {
  id: ID!
  ts: Int!
  kind: String!
  text: String!
  amount: BigInt
  actor: String! # address of the main person
  counterparty: String # address of the other person, if any
  familyId: Int! # family of the actor (0 if none)
  counterpartyFamilyId: Int!
  txHash: String!
}

# ── missions ──
# A parent-funded task. status: ACTIVE | SUBMITTED | REJECTED | APPROVED | CANCELLED | EXPIRED
# Title, description and feedback are public on-chain text (kept short on purpose).
type Mission {
  id: ID!
  familyId: Int!
  parent: String!
  parentFamId: String!
  teen: String!
  teenFamId: String!
  reward: BigInt!
  deadline: Int!
  goalId: String! # "0" when not linked to a savings goal
  status: String!
  title: String!
  description: String!
  feedback: String! # the parent's last rejection note, if any
  createdAt: Int!
  submittedAt: Int!
  resolvedAt: Int! # 0 until approved, cancelled or expired
  savedToGoal: Boolean!
  txHash: String! # creating transaction
  lastTxHash: String! # most recent transition
}

# ── Progress Passport ──
# One row per confirmed, qualifying action. Its id is the source event, so a replayed event can never count twice.
# kind: MISSION_APPROVED | SAVED | GOAL_COMPLETED | PAYMENT
type ProgressEvent {
  id: ID! # txHash-logIndex
  teen: String!
  familyId: Int!
  kind: String!
  amount: BigInt!
  text: String!
  weekId: String!
  ts: Int!
  blockNumber: Int!
  txHash: String!
}

# Running totals per teen. Counts and base-unit sums of responsible actions only; there is no score.
type Achievement {
  id: ID! # teen-kind
  teen: String!
  familyId: Int!
  kind: String!
  sourceEvent: String!
  txHash: String!
  blockNumber: Int!
  logIndex: Int!
  ts: Int!
}

type TeenProgress {
  id: ID! # teen address
  familyId: Int!
  teenFamId: String!
  missionsCompleted: Int!
  missionRewards: BigInt!
  savedTotal: BigInt! # the teen's own savings contributions (a mission reward saved to a goal also counts here)
  matchedTotal: BigInt! # released family gifts, not the teen's earnings or spending
  goalsCompleted: Int!
  paymentsCompleted: Int! # payments that settled inside the family's rules
  lastEventTs: Int!
  lastEventBlock: Int!
}

# The same totals per teen per local week (Monday start, in the family's time zone).
type WeeklyStat {
  id: ID! # teen-week
  teen: String!
  teenFamId: String!
  familyId: Int!
  week: Int!
  weekStart: Int! # UTC timestamp of local Monday 00:00
  missionsCompleted: Int!
  missionRewards: BigInt!
  savedTotal: BigInt!
  matchedTotal: BigInt!
  goalsCompleted: Int!
  paymentsCompleted: Int!
  allowanceFunded: BigInt!
  heldCount: Int!
}

# One receipt per transaction and goal, connecting savings, matching and a mission reward.
# Totals are contributions, never investment returns; totalAfter is the goal's event snapshot.
type SavingReceipt {
  id: ID! # txHash-goalId
  goalId: String!
  teen: String!
  teenFamId: String!
  familyId: Int!
  goalName: String!
  ownAmount: BigInt!
  matchedAmount: BigInt!
  totalAfter: BigInt!
  target: BigInt!
  source: String! # SAVING | MISSION
  missionId: String!
  missionTitle: String!
  ts: Int!
  blockNumber: Int!
  txHash: String!
}

# Source logs remain separate so repeated delivery cannot inflate a combined receipt.
type SavingContribution {
  id: ID! # txHash-logIndex
  receiptId: String!
  amount: BigInt!
  matchedAmount: BigInt!
}

type MatchRelease {
  id: ID! # txHash-logIndex
  receiptId: String! # txHash-goalId
  goalId: String!
  giftId: String!
  sponsor: String!
  sponsorFamId: String!
  teen: String!
  familyId: Int!
  amount: BigInt!
  ts: Int!
  blockNumber: Int!
  txHash: String!
}

# ── FutureFund: tracked and locked inside Fam-Fi. Never invested. ──
type FutureFund {
  id: ID!
  familyId: Int!
  parent: String!
  teen: String!
  teenFamId: String!
  name: String!
  purpose: String!
  target: BigInt!
  funded: BigInt!
  horizon: Int!
  status: String! # OPEN | RELEASED
  createdAt: Int!
  releasedAt: Int!
}

type FundEntry {
  id: ID! # txHash-logIndex
  fundId: String!
  teen: String!
  familyId: Int!
  kind: String! # CREATED | CONTRIBUTED | RELEASED
  amount: BigInt!
  text: String!
  ts: Int!
  blockNumber: Int!
  txHash: String!
}
